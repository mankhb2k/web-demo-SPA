<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OpenClaw SaaS — Modern Docker Strategy</title>
    
    <!-- Landing Page CSS -->
    <link rel="stylesheet" href="openclaw-saas/css/base.css" />
    <link rel="stylesheet" href="openclaw-saas/css/components.css" />

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

    <style>
        /* Landing Page Specific Styles */
        #landing-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(24, 24, 27, 0.5) 0%, transparent 100%),
                linear-gradient(rgba(24, 24, 27, 0.1) 1px, transparent 1px),
                linear-gradient(90base, rgba(24, 24, 27, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: #ffffff;
            text-align: center;
            padding: 2rem;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        #landing-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, #000 70%);
            pointer-events: none;
        }

        .hero-content {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-out;
        }

        .hero-title {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -0.06em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to bottom, #ffffff 30%, #52525b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: #a1a1aa;
            max-width: 540px;
            margin-bottom: 3rem;
            line-height: 1.6;
            font-weight: 400;
        }

        .launch-btn {
            background: #ffffff;
            color: #000000;
            padding: 1.1rem 3rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.25);
        }

        .feature-dots {
            display: flex;
            gap: 3rem;
            margin-top: 5rem;
            opacity: 0.6;
        }

        .dot-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            color: #fafafa;
            font-weight: 500;
        }

        #app-root {
            display: none;
            animation: fadeInApp 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInApp {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Hidden Class */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Landing Page Session -->
    <div id="landing-page">
        <div class="hero-content">
            <iconify-icon icon="lucide:box" style="font-size: 5rem; color: #ffffff; margin-bottom: 2.5rem;"></iconify-icon>
            <h1 class="hero-title">OpenClaw SaaS</h1>
            <p class="hero-subtitle">
                Hệ thống quản trị hạ tầng Docker chuyên nghiệp với kiến trúc isolation tuyệt đối. 
                Quản lý hàng ngàn container với hiệu năng và bảo mật tối ưu.
            </p>
            
            <a href="openclaw-saas/openclaw-saas.html" class="launch-btn">
                Mở Dashboard Quản Trị
                <iconify-icon icon="lucide:arrow-right" style="font-size:1.2rem"></iconify-icon>
            </a>

            <div class="feature-dots">
                <div class="dot-item"><iconify-icon icon="lucide:shield-check" style="color:#fafafa"></iconify-icon> Isolation</div>
                <div class="dot-item"><iconify-icon icon="lucide:zap" style="color:#fafafa"></iconify-icon> Performance</div>
                <div class="dot-item"><iconify-icon icon="lucide:database" style="color:#fafafa"></iconify-icon> Persistent</div>
            </div>
        </div>
    </div>



    <!-- No JS needed for the landing page link -->
</body>
</html>
